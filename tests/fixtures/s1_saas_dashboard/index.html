<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Analytics Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-theme">
  <div id="root" class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-left">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <h1 class="header-title">Nexus Analytics</h1>
      </div>
      <div class="header-actions">
        <div class="date-tabs" role="tablist">
          <button class="tab-btn active" role="tab" aria-selected="true" data-period="7d">7D</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-period="30d">30D</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-period="90d">90D</button>
        </div>
        <button class="btn btn-primary" id="exportBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
          </svg>
          <span>Export Report</span>
        </button>
      </div>
    </header>

    <main class="dashboard-main">
      <section class="metrics-grid">
        <div class="metric-card">
          <div class="metric-header">
            <span class="metric-label">Monthly Recurring Revenue</span>
            <div class="icon-badge positive">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
              </svg>
            </div>
          </div>
          <div class="metric-value">$124,592</div>
          <div class="metric-trend positive">
            <span class="trend-indicator">+14.2%</span>
            <span class="trend-label">vs last month</span>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-header">
            <span class="metric-label">Active Workspaces</span>
            <div class="icon-badge neutral">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
              </svg>
            </div>
          </div>
          <div class="metric-value">3,842</div>
          <div class="metric-trend positive">
            <span class="trend-indicator">+8.7%</span>
            <span class="trend-label">vs last month</span>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-header">
            <span class="metric-label">Churn Rate</span>
            <div class="icon-badge negative">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
              </svg>
            </div>
          </div>
          <div class="metric-value">1.18%</div>
          <div class="metric-trend negative">
            <span class="trend-indicator">-0.3%</span>
            <span class="trend-label">improvement</span>
          </div>
        </div>
      </section>

      <section class="chart-section card">
        <div class="card-header">
          <div class="card-title-group">
            <h2 class="card-title">Performance Over Time</h2>
            <p class="card-subtitle">Real-time throughput and user engagement velocity</p>
          </div>
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-color current"></span>Current Period</span>
            <span class="legend-item"><span class="legend-color baseline"></span>Previous Period</span>
          </div>
        </div>
        <div class="chart-container animated-fade-in">
          <div class="chart-bars">
            <div class="bar-col"><div class="bar bar-baseline" style="height: 40%"></div><div class="bar bar-current" style="height: 65%"></div><span class="bar-label">Mon</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 55%"></div><div class="bar bar-current" style="height: 75%"></div><span class="bar-label">Tue</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 50%"></div><div class="bar bar-current" style="height: 85%"></div><span class="bar-label">Wed</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 60%"></div><div class="bar bar-current" style="height: 90%"></div><span class="bar-label">Thu</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 70%"></div><div class="bar bar-current" style="height: 95%"></div><span class="bar-label">Fri</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 45%"></div><div class="bar bar-current" style="height: 60%"></div><span class="bar-label">Sat</span></div>
            <div class="bar-col"><div class="bar bar-baseline" style="height: 35%"></div><div class="bar bar-current" style="height: 50%"></div><span class="bar-label">Sun</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
